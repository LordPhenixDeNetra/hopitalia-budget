# Environnement de développement local. Copier .env.example en .env et renseigner les valeurs.
name: hopitalia-budget
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopitalia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-hopitalia_budget}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    image: hopitalia-budget-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ./frontend
    image: hopitalia-budget-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db-data:
