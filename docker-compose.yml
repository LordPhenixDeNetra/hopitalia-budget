# Environnement de développement local. Copier .env.example en .env et renseigner les valeurs.
name: hopitalia-budget
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopitalia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-hopitalia_budget}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    image: hopitalia-budget-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hopitalia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hopitalia_budget}
      HOPITALIA_API_URL: ${HOPITALIA_API_URL:-}
      HOPITALIA_JWT_CLE: ${HOPITALIA_JWT_CLE:-}
      COORDONNEES_CLE: ${COORDONNEES_CLE:-}
    volumes:
      - pieces:/app/pieces
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Tâche quotidienne des alertes planifiées (T-222), avec l'image de l'API.
  alertes:
    image: hopitalia-budget-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hopitalia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hopitalia_budget}
      HOPITALIA_API_URL: ${HOPITALIA_API_URL:-}
      HOPITALIA_JWT_CLE: ${HOPITALIA_JWT_CLE:-}
      COORDONNEES_CLE: ${COORDONNEES_CLE:-}
    # Une minute d'attente : l'API applique les migrations à son démarrage.
    command: ["sh", "-c", "sleep 60; while true; do python -m hopitalia_budget.outils.alertes; sleep 86400; done"]
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./frontend
    image: hopitalia-budget-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db-data:
  pieces:
