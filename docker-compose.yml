# Environnement de développement local. Copier .env.example en .env et renseigner les valeurs.
name: hopitalia-budget
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopitalia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-hopitalia_budget}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    # Redémarre avec le serveur (plan d'exploitation, section 4).
    restart: unless-stopped

  api:
    build: ./backend
    image: hopitalia-budget-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hopitalia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hopitalia_budget}
      HOPITALIA_API_URL: ${HOPITALIA_API_URL:-}
      HOPITALIA_JWT_CLE: ${HOPITALIA_JWT_CLE:-}
      HOPITALIA_COMPTE_TECHNIQUE: ${HOPITALIA_COMPTE_TECHNIQUE:-}
      HOPITALIA_COMPTE_TECHNIQUE_MOT_DE_PASSE: ${HOPITALIA_COMPTE_TECHNIQUE_MOT_DE_PASSE:-}
      HOPITALIA_ETABLISSEMENT: ${HOPITALIA_ETABLISSEMENT:-}
      COORDONNEES_CLE: ${COORDONNEES_CLE:-}
      # Adresse du client transmise par nginx (limitation de débit par adresse, T-252). Toute
      # source est admise : l'API n'est joignable que par nginx et depuis le serveur lui-même.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - pieces:/app/pieces
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Tâche quotidienne des alertes planifiées (T-222), avec l'image de l'API.
  alertes:
    image: hopitalia-budget-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hopitalia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hopitalia_budget}
      HOPITALIA_API_URL: ${HOPITALIA_API_URL:-}
      HOPITALIA_JWT_CLE: ${HOPITALIA_JWT_CLE:-}
      COORDONNEES_CLE: ${COORDONNEES_CLE:-}
    # Une minute d'attente : l'API applique les migrations à son démarrage.
    command: ["sh", "-c", "sleep 60; while true; do python -m hopitalia_budget.outils.alertes; sleep 86400; done"]
    depends_on:
      - api
    restart: unless-stopped

  # Courriels d'alerte (T-225) : file envoyée chaque minute ; sans SMTP_HOTE, elle attend.
  courriels:
    image: hopitalia-budget-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hopitalia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hopitalia_budget}
      SMTP_HOTE: ${SMTP_HOTE:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:-}
      SMTP_EXPEDITEUR: ${SMTP_EXPEDITEUR:-hopitalia-budget@localhost}
      URL_APPLICATION: ${URL_APPLICATION:-}
    command: ["sh", "-c", "sleep 60; while true; do python -m hopitalia_budget.outils.courriels; sleep 60; done"]
    depends_on:
      - api
    restart: unless-stopped

  # Échanges quotidiens avec Hopitalia (lot 7) : fournisseurs, services, pharmacie, puis reprise
  # des échanges en échec. Hopitalia est lu par le compte technique, jamais écrit.
  integrations:
    image: hopitalia-budget-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hopitalia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hopitalia_budget}
      HOPITALIA_API_URL: ${HOPITALIA_API_URL:-}
      HOPITALIA_COMPTE_TECHNIQUE: ${HOPITALIA_COMPTE_TECHNIQUE:-}
      HOPITALIA_COMPTE_TECHNIQUE_MOT_DE_PASSE: ${HOPITALIA_COMPTE_TECHNIQUE_MOT_DE_PASSE:-}
      HOPITALIA_ETABLISSEMENT: ${HOPITALIA_ETABLISSEMENT:-}
    # Une minute d'attente : l'API applique les migrations à son démarrage.
    command: ["sh", "-c", "sleep 60; while true; do python -m hopitalia_budget.outils.integrations; sleep 86400; done"]
    depends_on:
      - api
    restart: unless-stopped

  # Sauvegarde quotidienne de la base et des pièces (T-253 ; documentation : installer/sauvegarde).
  sauvegarde:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hopitalia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hopitalia_budget}
      RETENTION_JOURS: ${RETENTION_JOURS:-30}
    volumes:
      - ./exploitation:/exploitation:ro
      - sauvegardes:/sauvegardes
      - pieces:/pieces
    command: ["sh", "-c", "while true; do sh /exploitation/sauvegarder.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Contexte à la racine : l'image embarque l'interface et la documentation (site/).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: hopitalia-budget-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  db-data:
  pieces:
  # Copier ce volume hors du serveur (documentation : installer/sauvegarde) : sur le même disque, il ne
  # protège pas d'une panne du serveur.
  sauvegardes:
