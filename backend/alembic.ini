[alembic]
script_location = migrations
# L'adresse de la base vient de DATABASE_URL (voir migrations/env.py), jamais de ce fichier.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
