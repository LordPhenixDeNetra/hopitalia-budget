server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Derrière un proxy (Traefik de Dokploy, proxy HTTPS de l'hôpital) : l'adresse du client est celle
    # qu'il transmet, et seulement s'il est sur un réseau privé ; sinon, celle de la connexion.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Pièces justificatives jusqu'à 20 Mo (routes/workflow.py, TAILLE_MAX_MO), plus l'enveloppe.
    client_max_body_size 21m;

    # En-têtes de sécurité (T-252) : hérités par les blocs location, qui n'en définissent pas.
    # style-src 'unsafe-inline' : Ant Design injecte ses styles à l'exécution (CSS-in-JS).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API servie par le conteneur « api » : même origine pour le navigateur, pas de CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Adresse réelle du client, remplacée et non ajoutée : un client ne peut pas la forger.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Documentation (site/), statique. Ses en-têtes de sécurité autorisent les scripts inline de
    # Starlight par leur empreinte (site/scripts/csp.mjs). Une adresse inconnue reçoit la page 404
    # du site, jamais l'application.
    location /docs/ {
        include /etc/nginx/en-tetes-docs.conf;
        absolute_redirect off;
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # Liens profonds : toute adresse de l'interface renvoie l'application (T-065).
    location / {
        try_files $uri /index.html;
    }
}
